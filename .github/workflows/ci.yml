name: Ktor CI Playground

# 1. Tentukan kapan aksi otomatis ini akan berjalan
on:
  push:
    branches: [ "main", "master" ] # Berjalan setiap kali Anda push ke branch main
  pull_request:
    branches: [ "main", "master" ] # Berjalan setiap ada Pull Request ke branch main

jobs:
  build:
    # 2. Gunakan sistem operasi Ubuntu terbaru di server GitHub
    runs-on: ubuntu-latest

    steps:
      # Langkah A: Unduh kode proyek Anda ke server GitHub
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Langkah B: Siapkan lingkungan Java (JDK 21 - sesuaikan dengan versi JDK proyek Anda)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle' # Mengaktifkan cache agar proses build berikutnya lebih cepat

      # Langkah C: Berikan izin akses keamanan pada file gradlew launcher
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Langkah D: Jalankan proses kompilasi dan testing otomatis menggunakan Gradle
      - name: Build and Run Tests with Gradle
        run: ./gradlew build